<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanzi Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one column workbench. A DIN-rail strip holds the sentence; colour-coded terminal blocks wait in a tray below it. */
:root{
  --bg:oklch(0.972 0.007 250);
  --surface:oklch(0.995 0.003 250);
  --surface2:oklch(0.945 0.01 250);
  --fg:oklch(0.23 0.025 258);
  --muted:oklch(0.48 0.025 258);
  --line:oklch(0.87 0.014 255);
  --rail:oklch(0.8 0.015 255);
  --rail-hole:oklch(0.69 0.02 255);
  --ok:oklch(0.5 0.15 150);
  --bad:oklch(0.54 0.2 27);
  --band-l:.47; --band-c:.15; --band-fg:#fff;
  --tint-l:.95; --tint-c:.035; --edge-l:.8;
  --btn-bg:var(--fg); --btn-fg:var(--bg);
  --shadow:0 1px 0 oklch(0.8 0.01 255), 0 6px 14px -8px oklch(0.3 0.03 258 / .35);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:oklch(0.2 0.02 258); --surface:oklch(0.25 0.022 258); --surface2:oklch(0.29 0.024 258);
    --fg:oklch(0.95 0.01 255); --muted:oklch(0.74 0.02 255); --line:oklch(0.38 0.025 258);
    --rail:oklch(0.42 0.02 258); --rail-hole:oklch(0.31 0.02 258);
    --ok:oklch(0.8 0.15 150); --bad:oklch(0.76 0.16 27);
    --band-l:.76; --band-c:.13; --band-fg:oklch(0.2 0.02 258);
    --tint-l:.3; --tint-c:.06; --edge-l:.5;
    --shadow:0 1px 0 oklch(0.15 0.02 258), 0 6px 14px -8px oklch(0.1 0.02 258 / .8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:oklch(0.2 0.02 258); --surface:oklch(0.25 0.022 258); --surface2:oklch(0.29 0.024 258);
  --fg:oklch(0.95 0.01 255); --muted:oklch(0.74 0.02 255); --line:oklch(0.38 0.025 258);
  --rail:oklch(0.42 0.02 258); --rail-hole:oklch(0.31 0.02 258);
  --ok:oklch(0.8 0.15 150); --bad:oklch(0.76 0.16 27);
  --band-l:.76; --band-c:.13; --band-fg:oklch(0.2 0.02 258);
  --tint-l:.3; --tint-c:.06; --edge-l:.5;
  --shadow:0 1px 0 oklch(0.15 0.02 258), 0 6px 14px -8px oklch(0.1 0.02 258 / .8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-display)}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:16px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;font:700 22px/1 var(--f-display);letter-spacing:-.01em}
.mark{display:flex;gap:3px}
.mark i{width:9px;height:20px;border-radius:2px;background:oklch(var(--band-l) var(--band-c) var(--h))}
.toggles{display:flex;gap:8px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer}
.sw span{display:block;border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;font:500 12px/1 var(--f-mono);letter-spacing:.04em;background:var(--surface)}
.sw input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}

/* type */
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:700 clamp(30px,6vw,46px)/1.05 var(--f-display);letter-spacing:-.02em;margin:8px 0 12px;text-wrap:balance}
h2{font:600 18px/1.3 var(--f-display);margin:0 0 4px;text-wrap:balance}
.lead{max-width:62ch;margin:0 0 4px;color:var(--fg)}
.muted{color:var(--muted)}
section{margin-block:28px}

/* buttons */
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:8px;padding:12px 22px;font:600 15px/1 var(--f-display);cursor:pointer}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn2{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:11px 18px;font:500 14px/1 var(--f-display);cursor:pointer}
.btn2:hover{border-color:var(--muted)}
.back{background:none;border:0;padding:4px 0;cursor:pointer;font:500 13px/1 var(--f-mono);color:var(--muted)}
.back:hover{color:var(--fg)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font:400 13px/1.4 var(--f-display);color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* role chips */
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:6px 11px;border-radius:6px;background:oklch(var(--tint-l) var(--tint-c) var(--h));border:1.5px solid oklch(var(--edge-l) .08 var(--h));border-left:6px solid oklch(var(--band-l) var(--band-c) var(--h));font:500 12px/1.2 var(--f-mono);letter-spacing:.03em}
.chip em{font:700 15px/1 var(--f-zh);font-style:normal;letter-spacing:0}
.chip.sm{padding:3px 7px;font-size:10px;border-left-width:5px}
.chip.sm em{font-size:12px}
.pattern{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
.plus{color:var(--muted);font:500 14px/1 var(--f-mono)}
.key{display:flex;flex-wrap:wrap;gap:8px}

/* level list */
.levels{display:grid;gap:10px;margin-top:14px}
.lvl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.lvl:hover:not(:disabled){border-color:var(--muted)}
.lvl:disabled{opacity:.5;cursor:not-allowed}
.lvl-n{font:500 13px/1 var(--f-mono);color:var(--muted)}
.lvl-main{min-width:0}
.lvl-main b{display:block;font-weight:600;margin-bottom:6px}
.mini{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lvl-st{font:500 11px/1.2 var(--f-mono);color:var(--muted);text-align:right}

/* terminal blocks */
.tile{--band:oklch(var(--band-l) var(--band-c) var(--h));--tint:oklch(var(--tint-l) var(--tint-c) var(--h));--edge:oklch(var(--edge-l) .08 var(--h));
  display:flex;flex-direction:column;min-width:70px;border-radius:7px;background:var(--tint);border:1.5px solid var(--edge);box-shadow:var(--shadow);overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;text-align:center}
.tile .band{background:var(--band);color:var(--band-fg);font:500 9.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;padding:5px 6px}
.tile .zh{font:700 28px/1.2 var(--f-zh);padding:8px 10px 6px;white-space:nowrap}
.tile .py{font:400 11.5px/1.2 var(--f-mono);color:var(--muted);padding:0 8px 6px}
.tile .en{font:400 11px/1.25 var(--f-display);color:var(--muted);padding:0 8px 7px;max-width:110px;margin-inline:auto}
body[data-py="0"] .py{display:none}
body[data-en="0"] .tile .en{display:none}
.tile.static{cursor:default}
.tile.hint{outline:3px solid var(--fg);outline-offset:2px}
.tile.dragging{opacity:.25}
.tile.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.96;box-shadow:0 14px 24px -10px oklch(0.2 0.03 258 / .55);cursor:grabbing}
.tiles{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}

/* rail and slots */
.rail{display:flex;flex-wrap:wrap;gap:10px;position:relative;padding:14px 14px 30px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.rail::after{content:"";position:absolute;left:10px;right:10px;bottom:12px;height:9px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--rail) 0 18px,var(--rail-hole) 18px 30px)}
.rail.flat{display:inline-flex;max-width:100%}
.slot{display:flex;flex-direction:column;gap:6px;align-items:center;position:relative;z-index:1}
.slot-label{display:flex;align-items:center;gap:5px;font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.slot-label i{width:8px;height:8px;border-radius:2px;background:oklch(var(--band-l) var(--band-c) var(--h))}
.slot.neutral .slot-label i{background:var(--rail)}
.well{position:relative;min-width:86px;min-height:104px;border-radius:9px;border:1.5px dashed oklch(var(--edge-l) .08 var(--h));display:flex;align-items:center;justify-content:center;background:color-mix(in oklch,var(--surface) 70%,oklch(var(--tint-l) var(--tint-c) var(--h)))}
.slot.neutral .well{border-color:var(--rail);background:var(--surface)}
.well.filled{border-color:transparent;background:transparent}
.slot.over .well{border-style:solid;background:oklch(var(--tint-l) var(--tint-c) var(--h))}
.slot.ok .well{outline:2.5px solid var(--ok);outline-offset:1px}
.slot.bad .well{outline:2.5px solid var(--bad);outline-offset:1px}
.slot.ok .well::after,.slot.bad .well::after{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-display);color:var(--bg);z-index:3}
.slot.ok .well::after{content:"\2713";background:var(--ok)}
.slot.bad .well::after{content:"\2717";background:var(--bad)}
.slot.hint .well{outline:3px solid var(--fg);outline-offset:2px}
.bank{display:flex;flex-wrap:wrap;gap:10px;min-height:128px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);align-items:flex-start}
.bank.over{border-style:solid;border-color:var(--muted)}
.bank-empty{color:var(--muted);font-size:13px;align-self:center;margin-inline:auto}

/* play */
.playbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:3px;margin-top:12px}
.dots i{height:5px;flex:1 1 0;min-width:0;max-width:24px;border-radius:3px;background:var(--line)}
.dots i.miss{background:var(--bad)}
.dots i.cur{background:var(--muted)}
.dots i.clean{background:var(--ok)}
.dots i.assisted{background:var(--rail-hole)}
.prompt h2{font:600 clamp(22px,4.6vw,32px)/1.2 var(--f-display);letter-spacing:-.01em;margin:8px 0 0}
.prompt .sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.actions .spacer{flex:1}
.fb{margin-top:18px;min-height:24px}
.fb-idle{color:var(--muted);font-size:14px;margin:0}
.fb-bad{margin:0;color:var(--bad);font-weight:500}
.okcard{border:1.5px solid var(--ok);border-radius:10px;padding:14px 16px;background:var(--surface)}
.okcard .tag{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin:0 0 8px}
.zhline{font:700 clamp(22px,5vw,30px)/1.3 var(--f-zh);margin:0;letter-spacing:.04em}
.pyline{font:400 14px/1.4 var(--f-mono);color:var(--muted);margin:2px 0 0}
.enline{margin:8px 0 0}
.note{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;max-width:64ch}

/* done */
.review{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.review li{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:9px}
.review .zh{font:700 20px/1.3 var(--f-zh);letter-spacing:.04em}
.review .enl{color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* recognition game */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.setbtn{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer}
.setbtn:hover{border-color:var(--muted)}
.setbtn b{font-weight:600}
.setbtn span{font:500 11px/1.3 var(--f-mono);color:var(--muted)}
.rq{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;padding:28px 16px 24px;min-height:210px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;text-align:center}
.rq .big{font:700 clamp(64px,18vw,112px)/1.1 var(--f-zh);letter-spacing:.02em}
.rq .py{font:400 20px/1.2 var(--f-mono);color:var(--muted)}
.rq .meaning{font:600 20px/1.3 var(--f-display)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.choice{min-height:58px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer;font:500 16px/1.3 var(--f-display);text-align:center;overflow-wrap:anywhere}
.choice:hover{border-color:var(--muted)}
.choice.right{border-color:var(--ok);outline:2px solid var(--ok)}
.choice.wrong{border-color:var(--bad);outline:2px solid var(--bad)}
.choice[aria-disabled="true"]{cursor:default}
.v-ok{margin:0;color:var(--ok);font-weight:600}

/* top bar: tips, feedback and page links */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.tb-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tipbtn{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:8px 14px 8px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);text-decoration:none;font:500 14px/1 var(--f-display)}
.tipbtn:hover{border-color:var(--muted)}
.tipbtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tipbtn img{display:block;flex:none;width:26px;height:26px;border-radius:6px}
.tipbtn.feedback{padding:8px 18px;background:var(--ok);border-color:var(--ok);color:var(--bg);font-weight:600}
.tipbtn.feedback:hover{filter:brightness(1.08)}
.navlink{min-height:44px;padding:0 8px;border:0;background:none;color:var(--muted);font:500 13px/1 var(--f-mono);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.navlink:hover{color:var(--fg)}

/* night train backdrop and its controls */
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.top{position:relative}
.scene summary{list-style:none;cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;font:500 12px/1 var(--f-mono);letter-spacing:.04em;background:var(--surface)}
.scene summary::-webkit-details-marker{display:none}
.scene[open] summary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scene summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.scene-panel{position:absolute;left:0;right:0;top:100%;margin-top:8px;z-index:20;display:flex;flex-wrap:wrap;gap:14px 28px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.scene-panel label{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;font:500 12px/1.2 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.scene-panel label b{color:var(--fg);font-weight:500}
.scene-panel input[type=range]{width:100%;min-height:28px;accent-color:var(--fg)}

/* statement page */
.pledge{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;max-width:62ch}
.pledge li{padding:12px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}

/* pace: relaxed or timed */
.pace{display:inline-flex;gap:2px;margin-top:10px;padding:3px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface)}
.pace button{border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:99px;font:500 13px/1 var(--f-mono);letter-spacing:.04em;cursor:pointer}
.pace button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.clock{font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.timeline{margin:6px 0 0;font:500 14px/1.4 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.timeline b{color:var(--fg)}
@media (max-width:520px){
  .choices{grid-template-columns:1fr}
  .tile{min-width:64px}
  .tile .zh{font-size:25px}
  .well{min-width:76px}
  .lvl{grid-template-columns:26px minmax(0,1fr)}
  .lvl-st{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="wrap">

 ['kan','ben','shu','book','books'],
 ['mai','ben','shu','book','books'],['mai','ge','pingguo','apple','apples'],['mai','ge','jidan','egg','eggs'],['mai','jian','chenshan','shirt','shirts'],['mai','zhi','mao','cat','cats'],['mai','zhi','gou','dog','dogs'],['mai','bei','kafei','cup of coffee','cups of coffee'],['mai','bei','niunai','cup of milk','cups of milk'],

/* entry = [english, tokens, note, alternate token strings] */
function ent(en,pair,note){return [en,pair[0],note,pair[1]];}
/* subject + time + rest, with the time-first order accepted as well */
function ST(s,t,rest){
 var main=J([s,t].concat(rest));
 return [main,t?[J([t,s].concat(rest))]:[]];
}
var TOLD='Time words can also lead the sentence, but they always stay ahead of the verb.';

function g1(){
 var s=pick(PEOPLE),a=pick(ACTS.filter(function(x){return x.o;}));
 return ent(cap(J([sEn(s),is3(s)?a.t:a.b,np(a)]))+'.',[J([s,a.v,a.o]),[]],'Subject, verb, object. The verb never changes form.');
}

function g2(){
 var s=pick(PEOPLE),pl=pick(PLACES),t=pick(Object.keys(TEN));
 var a=pick(ACTS.filter(function(x){return !x.st&&!x.mv&&PLACE_OK[pl].indexOf(x.g)>=0;}));
 var en=cap(J([sEn(s),t==='zuotian'?a.pa:(is3(s)?a.t:a.b),np(a),PEN[pl],TEN[t]]))+'.';
 return ent(en,ST(s,t,[pl,a.v,a.o]),'Time, then place, then the verb. '+TOLD);
}

var T3={le:['zuotian','jintian','zaoshang','wanshang'],zai:['xianzai'],hui:['mingtian','zhoumo','wanshang','xiawu','jintian']};
var N3={le:'了 sits right after the verb to mark a finished action.',zai:'在 before the verb means the action is happening now.',hui:'会 before the verb points to the future.'};
function g3(){
 var kind=pick(['le','zai','hui']),s=pick(PEOPLE);
 var a=pick(ACTS.filter(function(x){return !x.st&&!(kind==='zai'&&x.mv);}));
 var t=Math.random()<0.5?pick(T3[kind]):null;
 var v=kind==='le'?a.pa:(kind==='zai'?J([beF(s),a.ing]):'will '+a.b);
 var en=cap(J([sEn(s),v,np(a),t?TEN[t]:'']))+'.';
 var rest=kind==='le'?[a.v,'le',a.o]:[kind,a.v,a.o];
 return ent(en,ST(s,t,rest),N3[kind]);
}

var T4={bu:['jintian','meitian','xianzai'],mei:['zuotian','jintian'],hui:['mingtian','zhoumo','wanshang','xiawu']};
function g4(){
 var kind=pick(['bu','bu','mei','hui']),s=pick(PEOPLE);
 var a=pick(ACTS.filter(function(x){return kind==='bu'||!x.st;}));
 var t=(!a.st&&Math.random()<0.4)?pick(T4[kind]):null;
 var aux=kind==='bu'?J([doF(s),'not']):(kind==='mei'?'did not':'will not');
 var en=cap(J([sEn(s),aux,a.b,np(a),t?TEN[t]:'']))+'.';
 var rest=kind==='hui'?['bu','hui',a.v,a.o]:[kind==='bu'?'bu':'mei',a.v,a.o];
 var note=kind==='bu'?'不 goes straight before the verb.':(kind==='mei'?'没 is for the past, and there is no 了 with it.':'不 comes before 会.');
 return ent(en,ST(s,t,rest),note);
}

function g5(){
 var s=pick(PEOPLE.filter(function(x){return x!=='wo';})),kind=pick(['plain','plain','le','hui','place','neg']);
 var a,t,pl,en;
 if(kind==='plain'){
  a=pick(ACTS);
  return ent(cap(J([doF(s),sEn(s),a.b,np(a)]))+'?',[J([s,a.v,a.o,'ma']),[]],'Statement plus 吗. Nothing else moves.');
 }
 if(kind==='le'){
  a=pick(ACTS.filter(function(x){return !x.st;}));
  return ent(cap(J(['did',sEn(s),a.b,np(a)]))+'?',[J([s,a.v,'le',a.o,'ma']),[]],'了 marks the finished action, 吗 closes the question.');
 }
 if(kind==='hui'){
  a=pick(ACTS.filter(function(x){return !x.st;}));t=Math.random()<0.6?pick(['mingtian','zhoumo','wanshang','xiawu']):null;
  var r=ST(s,t,['hui',a.v,a.o,'ma']);
  return ent(cap(J(['will',sEn(s),a.b,np(a),t?TEN[t]:'']))+'?',r,'会 shows the future. Every block keeps its place, and 吗 closes the sentence.');
 }
 if(kind==='place'){
  pl=pick(PLACES);t=pick(['jintian','mingtian','meitian','xiawu','wanshang','zhoumo']);
  a=pick(ACTS.filter(function(x){return !x.st&&!x.mv&&PLACE_OK[pl].indexOf(x.g)>=0;}));
  return ent(cap(J([doF(s),sEn(s),a.b,np(a),PEN[pl],TEN[t]]))+'?',ST(s,t,[pl,a.v,a.o,'ma']),'Time and place stay before the verb. 吗 still goes last.');
 }
 a=pick(ACTS);
 return ent(cap(J([doF(s)==='does'?"doesn't":"don't",sEn(s),a.b,np(a)]))+'?',[J([s,'bu',a.v,a.o,'ma']),[]],'Negation and a question can sit in one sentence.');
}

function g6(){
 var sid,sen,be,adjs,k;
 if(Math.random()<0.5){var s=pick(PEOPLE);sid=s;sen=sEn(s);be=beF(s);adjs=PADJ;}
 else{k=pick(THINGS);sid=k+':s';sen='the '+THING[k][0];be=thBe(k);adjs=THING[k][1].split(' ');}
 var adj=pick(adjs),ae=ADJEN[adj],r=Math.random();
 if(r<0.5)return ent(cap(J([sen,be,ae]))+'.',[J([sid,'hen',adj]),[]],'很 links the subject to the adjective. There is no verb to be.');
 if(r<0.75)return ent(cap(J([sen,be,'not',ae]))+'.',[J([sid,'bu',adj]),[]],'不 goes before the adjective, and the 很 drops out.');
 return ent(cap(J([be,sen,ae]))+'?',[J([sid,adj,'ma']),[]],'In a yes/no question the 很 drops out and 吗 closes the sentence.');
}

function g7(){
 var s=pick(PEOPLE),p=pick(PAIRS),n=pick(NUMS),v=VEN[p[0]];
 return ent(cap(J([sEn(s),is3(s)?v[1]:v[0],n[1],pnoun(p,n)]))+'.',[J([s,p[0],n[0],p[1],ptok(p)]),[]],'Number, then measure word, then the noun. Each noun has its own measure word.');
}

function g8(){
 var o=pick(PEOPLE),r=Math.random(),k;
 if(r<0.25){k=pick(THINGS);return ent(poss(o)+' '+THING[k][0],[J([o+':s:Owner','de',k+':o:Thing']),[]],'Owner, then 的, then the thing owned.');}
 if(r<0.45){k=pick(THINGS.filter(function(x){return x!=='yifu';}));return ent(cap('this is '+poss(o)+' '+THING[k][0])+'.',[J(['zhe','shi',o+':s:Owner','de',k+':o:Thing']),[]],'是 links two nouns, just as is does in English.');}
 if(r<0.8){
  var s=pick(PEOPLE),a=pick(OACTL);
  return ent(cap(J([sEn(s),is3(s)?a.t:a.b,poss(o),OBJ[a.o][1]]))+'.',[J([s,a.v,o+':s:Owner','de',a.o]),[]],'The whole owner phrase sits where the object goes.');
 }
 k=pick(THINGS);var adj=thAdj(k);
 return ent(cap(J([poss(o),THING[k][0],thBe(k),ADJEN[adj]]))+'.',[J([o+':s:Owner','de',k+':s:Thing','hen',adj]),[]],'An owner phrase can be the subject of an adjective sentence.');
}

var G9=[
 function(){
  var s=pick(PEOPLE),p=pick(PAIRS.filter(function(x){return x[0]!=='you';})),n=pick(NUMS);

 },
 function(){

  return ent(cap(J(['did',sEn(s),VEN[p[0]][0],n[1],pnoun(p,n),TEN[t]]))+'?',ST(s,t,[p[0],'le',n[0],p[1],ptok(p),'ma']),'了 for finished, 吗 to ask.');
 },
 function(){
  var s=pick(PEOPLE),a=pick(ACTS.filter(function(x){return !x.st;})),t=pick(['mingtian','zhoumo','wanshang','xiawu']);

 },
 function(){

 },

function idsOf(tokens){return tokens.split(' ').map(function(t){return t.split(':')[0];});}
function fill(L,fn){
 var seen={},out=[];
 L.ex.forEach(function(e){seen[e[1]]=1;out.push(e);});
 var guard=0;
 while(out.length<TARGET&&guard++<8000){
  var e=fn();
  if(!e||seen[e[1]])continue;
  var d=idsOf(e[1]);
  if(d.some(function(x,i){return d.indexOf(x)!==i;}))continue;
  seen[e[1]]=1;out.push(e);
 }
 L.ex=out;
}
LEVELS.forEach(function(L){fill(L,GENS[L.id]);});

  var cls='slot'+(showLbl?'':' neutral')+(S.status&&S.status[i]?' '+S.status[i]:'')+(S.hintSlot===i?' hint':'');
  return '<div class="'+cls+'" data-slot="'+i+'" style="--h:'+(showLbl?ROLES[a.role].h:250)+'"><span class="slot-label"><i></i>'+lbl+'</span>'+
    '<div class="well'+(t?' filled':'')+'">'+(t?tileHTML(t,{hint:S.hintUid===t.uid}):'')+'</div></div>';
}

function renderPlay(){

  var fb;

    var ids=ex.ans.map(function(a){return a.id;});
    var shown=S.slots.map(function(t){return t.wid;});

      (S.usedAlt?'<p class="note">That order works too. Chinese allows it here.</p>':'')+(ex.note?'<p class="note">'+ex.note+'</p>':'')+'</div>';
  }else if(S.fb){

      '<span class="spacer"></span><button class="btn" type="button" data-act="check"'+(full?'':' disabled')+'>Check</button>';
  }

  app.innerHTML=

    '<div class="dots" aria-hidden="true">'+dots+'</div>'+

    '<section style="margin-block:22px"><div class="rail">'+ex.ans.map(function(a,i){return slotHTML(i);}).join('')+'</div></section>'+
    '<section style="margin-block:0"><p class="eyebrow" style="margin-bottom:8px">Blocks &middot; drag to the rail, or tap a block</p>'+

    '<div class="actions">'+actions+'</div><div class="fb" role="status" aria-live="polite">'+fb+'</div>';
}

function renderDone(){

  var clean=S.results.filter(function(r){return r==='clean';}).length,total=L.ex.length;

    '<button class="btn2" type="button" data-act="replay">Replay</button><button class="btn2" type="button" data-act="home">All levels</button></div>';

/* ---------- game flow ---------- */
function openIntro(i){S.li=i;S.view='intro';render();window.scrollTo(0,0);}
function startLevel(i){
  S.li=i;S.results=[];S.revealStruct=false;
  S.timed=store.mode==='timed';S.t0=Date.now();S.levelMs=0;
  if(S.iv){clearInterval(S.iv);S.iv=null;}
  loadEx(0);
  if(S.timed)S.iv=setInterval(updClock,250);
}
function loadEx(n){
  var L=LEVELS[S.li],d=L.ex[n];
  var ans=P(d[1]);
  var ex={en:d[0],ans:ans,alts:(d[3]||[]).map(function(s){return P(s).map(function(a){return a.id;});}),note:d[2]};
  var used={};ans.forEach(function(a){used[a.id]=1;});
  var pool=[];
  for(var i=0;i<=S.li;i++){LEVELS[i].words.forEach(function(w){if(!used[w])pool.push(w);});}
  var wantRoles={};ans.forEach(function(a){wantRoles[a.role]=1;});
  var pref=shuffle(pool.filter(function(w){return wantRoles[W[w][3]];})),rest=shuffle(pool.filter(function(w){return !wantRoles[W[w][3]];}));
  var count=S.li<2?2:3;
  var extra=pref.concat(rest).slice(0,count);
  var tiles=ans.map(function(a){return {uid:n+'-'+a.id,wid:a.id,role:a.role};}).concat(extra.map(function(w){return {uid:n+'-'+w,wid:w,role:W[w][3]};}));
  S.ex=ex;S.ei=n;S.bank=shuffle(tiles);S.slots=ans.map(function(){return null;});
  S.status=null;S.fb=null;S.attempts=0;S.hints=0;S.revealed=false;S.solved=false;S.usedAlt=false;S.locked=false;S.hintUid=null;S.hintSlot=null;
  S.view='play';render();window.scrollTo(0,0);
}
function findTile(uid){
  var i=S.bank.findIndex(function(t){return t.uid===uid;});
  if(i>=0)return {where:'bank',i:i};
  i=S.slots.findIndex(function(t){return t&&t.uid===uid;});
  return i>=0?{where:'slot',i:i}:null;
}
function pull(loc){
  if(loc.where==='bank')return S.bank.splice(loc.i,1)[0];
  var t=S.slots[loc.i];S.slots[loc.i]=null;return t;
}
function clearStatus(){S.status=null;S.fb=null;}
function moveToSlot(uid,si){
  var loc=findTile(uid);if(!loc)return;
  if(loc.where==='slot'&&loc.i===si)return;
  var occ=S.slots[si],t=pull(loc);
  if(occ){if(loc.where==='slot')S.slots[loc.i]=occ;else S.bank.push(occ);}
  S.slots[si]=t;clearStatus();
}
function moveToBank(uid){
  var loc=findTile(uid);if(!loc||loc.where==='bank')return;
  S.bank.push(pull(loc));clearStatus();
}
function tap(uid){
  var loc=findTile(uid);if(!loc)return;
  if(loc.where==='bank'){var si=S.slots.findIndex(function(x){return !x;});if(si>=0)moveToSlot(uid,si);}
  else moveToBank(uid);
}
function check(){
  if(S.solved||!S.slots.every(function(x){return !!x;}))return;
  S.attempts++;
  var seq=S.slots.map(function(t){return t.wid;});
  var cands=[S.ex.ans.map(function(a){return a.id;})].concat(S.ex.alts);
  var hit=cands.filter(function(c){return c.every(function(w,i){return w===seq[i];});})[0];
  if(hit){
    S.solved=true;S.locked=true;S.usedAlt=hit!==cands[0];S.status=seq.map(function(){return 'ok';});S.fb=null;
    var peeked=LEVELS[S.li].hidden&&S.revealStruct;
    S.results[S.ei]=(S.attempts===1&&!S.hints&&!S.revealed&&!peeked)?'clean':'assisted';
  }else{
    var best=cands[0],bn=-1;
    cands.forEach(function(c){var n=c.filter(function(w,i){return w===seq[i];}).length;if(n>bn){bn=n;best=c;}});
    S.status=seq.map(function(w,i){return w===best[i]?'ok':'bad';});
    S.fb='Not quite. '+bn+' of '+seq.length+' blocks are in the right spot. Move the ones marked with a cross, then check again.';
  }
  render();
}
function hint(){
  if(S.solved)return;
  S.hints++;
  var ans=S.ex.ans,i;
  for(i=0;i<ans.length;i++){if(!S.slots[i]||S.slots[i].wid!==ans[i].id)break;}
  if(i>=ans.length)return;
  var want=ans[i].id,uid=null;
  S.bank.concat(S.slots.filter(Boolean)).forEach(function(t){if(t.wid===want)uid=t.uid;});
  S.hintUid=uid;S.hintSlot=i;render();
  var snap=S.ei;
  setTimeout(function(){if(S.view==='play'&&S.ei===snap&&!drag){S.hintUid=null;S.hintSlot=null;render();}},2600);
}
function showAnswer(){
  if(S.solved)return;
  S.revealed=true;
  var all=S.bank.concat(S.slots.filter(Boolean));
  S.bank=all.filter(function(t){return !S.ex.ans.some(function(a){return a.id===t.wid;});});
  S.slots=S.ex.ans.map(function(a){return all.filter(function(t){return t.wid===a.id;})[0];});
  check();
}
function clearRail(){
  S.slots.forEach(function(t,i){if(t){S.bank.push(t);S.slots[i]=null;}});
  clearStatus();render();
}
function nextEx(){
  var L=LEVELS[S.li];
  if(S.ei+1<L.ex.length){loadEx(S.ei+1);return;}
  var clean=S.results.filter(function(r){return r==='clean';}).length;
  var prev=store.done[L.id];
  if(!prev||clean>prev.clean)store.done[L.id]={clean:clean,total:L.ex.length};
  if(S.timed){S.levelMs=Date.now()-S.t0;var bt=store.bestTime[L.id];if(!bt||S.levelMs<bt)store.bestTime[L.id]=S.levelMs;}
  save();S.view='done';render();window.scrollTo(0,0);
}

/* ---------- recognition game: see a character, pick the meaning ---------- */
var SETS={
 all:['Every word',null],
 things:['People and things',['s','o']],
 actions:['Actions',['v']],
 when:['Time and place',['t','p']],
 describe:['Describing words',['adj','deg']],
 count:['Numbers and counters',['num','mw']],
 little:['Little words',['asp','neg','q','poss']]
};
function setIds(k){var rs=SETS[k][1];return Object.keys(W).filter(function(id){return !rs||rs.indexOf(W[id][3])>=0;});}
var R=null;
function rOpts(){
  var id=R.q[R.i],role=W[id][3],gl=W[id][2];
  var ok=function(x){return x!==id&&W[x][2]!==gl;};
  var same=shuffle(Object.keys(W).filter(function(x){return ok(x)&&W[x][3]===role;}));
  var other=shuffle(Object.keys(W).filter(function(x){return ok(x)&&W[x][3]!==role;}));
  var pool=same.concat(other),out=[id],seen={};seen[gl]=1;
  for(var j=0;j<pool.length&&out.length<4;j++){var g=W[pool[j]][2];if(!seen[g]){seen[g]=1;out.push(pool[j]);}}
  R.opts=shuffle(out);
}
function rStart(k){
  R={set:k,q:shuffle(setIds(k)).slice(0,10),i:0,score:0,picked:null,opts:[],missed:[],res:[],stage:'play'};
  rOpts();S.view='recog';render();window.scrollTo(0,0);
}
function rPick(i){
  if(!R||R.picked!==null)return;
  var id=R.q[R.i];R.picked=i;
  if(R.opts[i]===id){R.score++;R.res[R.i]='clean';}
  else{R.missed.push(id);R.res[R.i]='miss';}
  render();
}
function rNext(){
  if(!R||R.picked===null)return;
  if(R.i+1<R.q.length){R.i++;R.picked=null;rOpts();}
  else{
    R.stage='end';
    if(store.best[R.set]==null||R.score>store.best[R.set]){store.best[R.set]=R.score;save();}
  }
  render();window.scrollTo(0,0);
}
function recogSection(){
  var btns=Object.keys(SETS).map(function(k){
    var n=setIds(k).length,len=Math.min(10,n),b=store.best[k];
    return '<button class="setbtn" type="button" data-act="rstart" data-set="'+k+'"><b>'+SETS[k][0]+'</b><span>'+n+' words'+(b!=null?' &middot; best '+b+' of '+len:'')+'</span></button>';
  }).join('');
  return '<section><p class="eyebrow">Mini game</p><h2>Know the Character</h2>'+
    '<p class="muted" style="margin:0;max-width:62ch">A character and its pinyin appear. Pick what it means. Ten characters per round, drawn from the set you choose.</p>'+
    '<div class="sets">'+btns+'</div></section>';
}
function renderRecog(){
  var len=R.q.length;
  if(R.stage==='end'){
    var msg=R.score>=len-1?'Sharp. Try a bigger set.':(R.score>=len*0.6?'Good run. A second pass will tighten it.':'Run it again. Characters stick with repetition.');
    var missed=R.missed.length?'<section><h2>Review these</h2><div class="tiles">'+R.missed.map(function(id){return tileHTML({wid:id,role:W[id][3]},{stat:true});}).join('')+'</div></section>':'';
    app.innerHTML=
      '<p class="eyebrow">Know the Character &middot; '+SETS[R.set][0]+'</p><h1>'+R.score+' of '+len+' correct</h1><p class="lead">'+msg+'</p>'+missed+
      '<div class="row"><button class="btn" type="button" data-act="rstart" data-set="'+R.set+'">Play again</button><button class="btn2" type="button" data-act="home">All games</button></div>';
    return;
  }
  var id=R.q[R.i],w=W[id],done=R.picked!==null;
  var dots='';for(var k=0;k<len;k++){dots+='<i class="'+(k===R.i&&!R.res[k]?'cur':(R.res[k]||''))+'"></i>';}
  var right=done&&R.opts[R.picked]===id;
  var reveal=done?'<span class="meaning">'+w[2]+'</span><span>'+chip(w[3],true)+'</span>':'';
  var verdict=done?(right?'<p class="v-ok">Correct.</p>':'<p class="fb-bad">Not quite. It means &ldquo;'+w[2]+'&rdquo;.</p>'):'<p class="fb-idle">Pick the meaning.</p>';
  var choices=R.opts.map(function(oid,i){
    var cls='choice';
    if(done){if(oid===id)cls+=' right';else if(i===R.picked)cls+=' wrong';}
    return '<button class="'+cls+'" type="button" data-act="rpick" data-i="'+i+'"'+(done?' aria-disabled="true"':'')+'>'+W[oid][2]+'</button>';
  }).join('');
  app.innerHTML=
    '<div class="playbar"><button class="back" type="button" data-act="home">&larr; Levels</button><span class="eyebrow">'+SETS[R.set][0]+' &middot; '+(R.i+1)+' of '+len+' &middot; '+R.score+' correct</span></div>'+
    '<div class="dots" aria-hidden="true">'+dots+'</div>'+
    '<section style="margin-top:24px"><p class="eyebrow">What does this mean?</p></section>'+
    '<div class="rq"><span class="big" lang="zh">'+w[0]+'</span><span class="py">'+w[1]+'</span>'+reveal+'</div>'+
    '<div class="choices">'+choices+'</div>'+
    '<div class="fb" role="status" aria-live="polite">'+verdict+'</div>'+
    '<div class="actions"><span class="spacer"></span>'+(done?'<button class="btn" type="button" data-act="rnext">'+(R.i+1<len?'Next character':'See results')+'</button>':'')+'</div>';
}

/* ---------- drag and drop (pointer events, so touch works too) ---------- */
var drag=null;
function clearOver(){Array.prototype.forEach.call(document.querySelectorAll('.over'),function(n){n.classList.remove('over');});}
function hover(x,y){
  clearOver();
  var t=document.elementFromPoint(x,y);if(!t)return;
  var sl=t.closest('.slot'),bk=t.closest('#bank');
  if(sl)sl.classList.add('over');else if(bk)bk.classList.add('over');
}
app.addEventListener('pointerdown',function(e){
  if(S.view!=='play'||S.locked)return;
  var el=e.target.closest('.tile[data-uid]');if(!el)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var r=el.getBoundingClientRect();
  drag={uid:el.dataset.uid,el:el,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,moved:false,ghost:null};
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
    drag.moved=true;
    var g=drag.el.cloneNode(true);g.removeAttribute('data-uid');g.removeAttribute('tabindex');g.classList.add('ghost');g.style.width=drag.w+'px';
    document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');
  }
  drag.ghost.style.transform='translate('+(e.clientX-drag.ox)+'px,'+(e.clientY-drag.oy)+'px) rotate(-2deg)';
  hover(e.clientX,e.clientY);
});
function endDrag(e,cancel){
  if(!drag)return;
  var d=drag;drag=null;
  if(d.ghost)d.ghost.remove();
  clearOver();
  if(!d.moved){if(!cancel){tap(d.uid);render();}return;}
  if(!cancel){
    var t=document.elementFromPoint(e.clientX,e.clientY);
    var sl=t&&t.closest('.slot'),bk=t&&t.closest('#bank');
    if(sl)moveToSlot(d.uid,+sl.dataset.slot);else if(bk)moveToBank(d.uid);
  }
  render();
}
document.addEventListener('pointerup',function(e){endDrag(e,false);});
document.addEventListener('pointercancel',function(e){endDrag(e,true);});
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var el=e.target.closest('.tile[data-uid]');if(!el||S.locked)return;
  e.preventDefault();S.focusUid=el.dataset.uid;
  tap(el.dataset.uid);
  render();
});

/* ---------- night train backdrop: wireframe scene with speed and brightness ---------- */
(function(){
  var cv=document.getElementById('scene');
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var SKEY='hanzirail.scene',cfg={speed:12,bright:30};
  var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(calm)cfg.speed=0;
  try{var rs=JSON.parse(localStorage.getItem(SKEY)||'null');if(rs){
    if(typeof rs.speed==='number')cfg.speed=Math.min(60,Math.max(0,rs.speed));
    if(typeof rs.bright==='number')cfg.bright=Math.min(100,Math.max(0,rs.bright));
  }}catch(e){}
  function saveCfg(){try{localStorage.setItem(SKEY,JSON.stringify(cfg));}catch(e){}}

  var CW=0,CH=0,FOC=1,ink='#1d2332',dirty=true,bk=0.3;
  function readInk(){
    var root=document.documentElement,t=root.getAttribute('data-theme');
    var dark=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    ink=dark?'#eef1f6':'#1d2332';dirty=true;
  }
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,1.5);
    CW=cv.width=Math.round(innerWidth*dpr);
    CH=cv.height=Math.round(innerHeight*dpr);
    FOC=Math.min(CW,CH*1.5)*0.95;
    ctx.lineWidth=Math.max(1,dpr);
    ctx.lineJoin='round';
    dirty=true;
  }

  /* camera: front-left, above the track */
  var CP=[-9,5.2,14],TG=[1.5,1.6,-9];
  function norm(v){var l=Math.hypot(v[0],v[1],v[2]);return [v[0]/l,v[1]/l,v[2]/l];}
  function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
  var FV=norm([TG[0]-CP[0],TG[1]-CP[1],TG[2]-CP[2]]);
  var RV=norm(cross(FV,[0,1,0]));
  var UV=cross(RV,FV);
  var NEAR=0.4,yoff=0;
  var A=[0,0,0],B=[0,0,0];
  function toCam(x,y,z,o){
    var dx=x-CP[0],dy=y+yoff-CP[1],dz=z-CP[2];
    o[0]=dx*RV[0]+dy*RV[1]+dz*RV[2];
    o[1]=dx*UV[0]+dy*UV[1]+dz*UV[2];
    o[2]=dx*FV[0]+dy*FV[1]+dz*FV[2];
  }
  function seg(x1,y1,z1,x2,y2,z2){
    toCam(x1,y1,z1,A);toCam(x2,y2,z2,B);
    if(A[2]<NEAR&&B[2]<NEAR)return;
    if(A[2]<NEAR){var t=(NEAR-A[2])/(B[2]-A[2]);A[0]+=(B[0]-A[0])*t;A[1]+=(B[1]-A[1])*t;A[2]=NEAR;}
    else if(B[2]<NEAR){var u=(NEAR-B[2])/(A[2]-B[2]);B[0]+=(A[0]-B[0])*u;B[1]+=(A[1]-B[1])*u;B[2]=NEAR;}
    ctx.moveTo(CW/2+A[0]/A[2]*FOC,CH/2-A[1]/A[2]*FOC);
    ctx.lineTo(CW/2+B[0]/B[2]*FOC,CH/2-B[1]/B[2]*FOC);
  }
  function pt(x,y,z,o){toCam(x,y,z,o);o[3]=CW/2+o[0]/o[2]*FOC;o[4]=CH/2-o[1]/o[2]*FOC;}

  /* train geometry */
  var SEC=[[-1.4,0.6],[-1.4,3.2],[-1.0,3.9],[1.0,3.9],[1.4,3.2],[1.4,0.6]];
  var NOSE_S=0.7,CY=2.2;
  var FRONT=SEC.map(function(p){return [p[0]*NOSE_S,CY+(p[1]-CY)*NOSE_S];});
  var Z_FULL=-5,CAR=15,CARS=4,Z_END=Z_FULL-CAR*CARS;
  function ringVisible(z){for(var i=0;i<4;i++)seg(SEC[i][0],SEC[i][1],z,SEC[i+1][0],SEC[i+1][1],z);}
  function drawTrain(wheelAng){
    var i,j,k,w,z,zs;
    ctx.beginPath();
    for(i=0;i<6;i++){
      j=(i+1)%6;
      seg(FRONT[i][0],FRONT[i][1],0,FRONT[j][0],FRONT[j][1],0);
      seg(FRONT[i][0],FRONT[i][1],0,SEC[i][0],SEC[i][1],Z_FULL);
    }
    seg(-0.55,2.9,0,0.55,2.9,0);seg(0.55,2.9,0,0.55,2.1,0);
    seg(0.55,2.1,0,-0.55,2.1,0);seg(-0.55,2.1,0,-0.55,2.9,0);
    for(i=0;i<5;i++)seg(SEC[i][0],SEC[i][1],Z_FULL,SEC[i][0],SEC[i][1],Z_END);
    seg(-1.4,1.6,Z_FULL,-1.4,1.6,Z_END);seg(-1.4,3.0,Z_FULL,-1.4,3.0,Z_END);
    for(z=Z_FULL;z>=Z_END;z-=2.5)ringVisible(z);
    for(k=0;k<=CARS;k++){ringVisible(Z_FULL-k*CAR-0.25);}
    for(k=0;k<CARS;k++){
      zs=Z_FULL-k*CAR;
      for(w=0;w<4;w++){
        var z1=zs-3.0-w*2.7,z2=z1-1.7;
        seg(-1.4,2.2,z1,-1.4,2.9,z1);seg(-1.4,2.9,z1,-1.4,2.9,z2);
        seg(-1.4,2.9,z2,-1.4,2.2,z2);seg(-1.4,2.2,z2,-1.4,2.2,z1);
      }
      seg(-1.4,0.8,zs-1.0,-1.4,3.0,zs-1.0);seg(-1.4,0.8,zs-2.2,-1.4,3.0,zs-2.2);
    }
    var r=0.45,wx=-0.75;
    for(k=0;k<CARS;k++){
      zs=Z_FULL-k*CAR;
      [zs-3.5,zs-11.5].forEach(function(bz){
        seg(-1.1,0.7,bz-1.5,-1.1,0.7,bz+1.5);
        [bz-0.9,bz+0.9].forEach(function(wz){
          for(var s2=0;s2<6;s2++){
            var a1=s2*Math.PI/3,a2=(s2+1)*Math.PI/3;
            seg(wx,r+Math.cos(a1)*r,wz+Math.sin(a1)*r,wx,r+Math.cos(a2)*r,wz+Math.sin(a2)*r);
          }
          seg(wx,r,wz,wx,r+Math.cos(wheelAng)*r,wz+Math.sin(wheelAng)*r);
        });
      });
    }
    ctx.strokeStyle=ink;ctx.globalAlpha=bk;ctx.stroke();
  }

  /* ground: rails, sleepers, lineside poles */
  var SLP=1.5,NSL=40,SL_RANGE=SLP*NSL,POLE=12,NPOLE=7;
  function drawGround(dist){
    var k,z;
    ctx.beginPath();
    seg(-0.75,0,-110,-0.75,0,14);seg(0.75,0,-110,0.75,0,14);
    seg(-0.88,0,-110,-0.88,0,14);seg(0.88,0,-110,0.88,0,14);
    for(k=0;k<NSL;k++){
      z=13-((k*SLP+dist)%SL_RANGE);
      seg(-1.6,0,z,1.6,0,z);seg(-1.6,0,z-0.28,1.6,0,z-0.28);
    }
    ctx.strokeStyle=ink;ctx.globalAlpha=0.8*bk;ctx.stroke();
    ctx.beginPath();
    for(k=0;k<NPOLE;k++){
      z=12-((k*POLE+dist)%(POLE*NPOLE));
      seg(-4,0,z,-4,6.5,z);seg(-4,6.5,z,-1.2,6.5,z);
    }
    ctx.globalAlpha=0.4*bk;ctx.stroke();
  }

  /* headlights */
  var LAMPS=[[-0.8,1.3,0.03],[0.8,1.3,0.03]];
  var BEAM_Z=11,BW=1.7,P0=[0,0,0,0,0],P1=[0,0,0,0,0],PL=[0,0,0,0,0];
  function drawBeams(clock,flick){
    var li,i,k;
    ctx.fillStyle=ink;ctx.globalAlpha=0.2*bk;
    ctx.beginPath();
    for(li=0;li<LAMPS.length;li++){
      var L=LAMPS[li],x=L[0],c=[[x-BW,0.02],[x+BW,0.02],[x+BW,3.4],[x-BW,3.4]];
      pt(L[0],L[1],L[2],PL);
      for(i=0;i<4;i++){
        var a=c[i],b=c[(i+1)%4];
        pt(a[0],a[1],BEAM_Z,P0);pt(b[0],b[1],BEAM_Z,P1);
        ctx.moveTo(PL[3],PL[4]);ctx.lineTo(P0[3],P0[4]);ctx.lineTo(P1[3],P1[4]);ctx.closePath();
      }
    }
    ctx.fill();
    ctx.beginPath();
    for(k=0;k<4;k++){
      var tz=(clock*7+k*3)%12,hw=0.9+tz*0.2,y0=Math.max(0.02,1.0-tz*0.09),y1=1.8+tz*0.14;
      seg(-hw,y0,tz,hw,y0,tz);seg(hw,y0,tz,hw,y1,tz);seg(hw,y1,tz,-hw,y1,tz);seg(-hw,y1,tz,-hw,y0,tz);
    }
    ctx.strokeStyle=ink;ctx.globalAlpha=0.5*flick*bk;ctx.stroke();
    ctx.fillStyle=ink;ctx.globalAlpha=flick*bk;
    for(li=0;li<LAMPS.length;li++){
      pt(LAMPS[li][0],LAMPS[li][1],LAMPS[li][2],PL);
      ctx.beginPath();ctx.arc(PL[3],PL[4],Math.max(2,0.17/PL[2]*FOC),0,6.2832);ctx.fill();
    }
  }

  /* loop: idle frames cost nothing when the train is stopped or dark */
  var dist=0,clock=0,last=0,n=0;
  function frame(ts){
    requestAnimationFrame(frame);
    if(!last)last=ts;
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    var moving=cfg.speed>0&&cfg.bright>0;
    if(moving){dist+=cfg.speed*dt;clock+=dt;}
    if(!moving&&!dirty)return;
    dirty=false;
    ctx.clearRect(0,0,CW,CH);
    if(cfg.bright===0)return;
    bk=cfg.bright/100;
    yoff=0;drawGround(dist);
    yoff=Math.sin(clock*13)*0.012;
    drawTrain(-dist/0.45);
    yoff=0;
    drawBeams(clock,0.9+0.1*Math.sin(clock*28));
    ctx.globalAlpha=1;
  }

  /* controls */
  var sp=document.getElementById('sceneSpeed'),br=document.getElementById('sceneBright');
  var spv=document.getElementById('sceneSpeedVal'),brv=document.getElementById('sceneBrightVal');
  function showVals(){
    spv.textContent=cfg.speed===0?'stopped':Math.round(cfg.speed/60*100)+'%';
    brv.textContent=cfg.bright===0?'off':cfg.bright+'%';
  }
  sp.value=cfg.speed;br.value=cfg.bright;showVals();
  sp.addEventListener('input',function(){cfg.speed=+sp.value;saveCfg();showVals();dirty=true;});
  br.addEventListener('input',function(){cfg.bright=+br.value;saveCfg();showVals();dirty=true;});

  try{new MutationObserver(readInk).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
  if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',readInk);}
  window.addEventListener('resize',resize);
  resize();readInk();requestAnimationFrame(frame);
})();

/* ---------- offline: the page and its fonts are saved on the first visit ---------- */
(function(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  function warm(){
    try{
      /* fetch again now that the worker is in charge, so the font files land in its cache */
      Array.prototype.forEach.call(document.querySelectorAll('link[rel="stylesheet"]'),function(l){
        if(/fonts\.googleapis\.com/.test(l.href))fetch(l.href).catch(function(){});
      });
      (performance.getEntriesByType('resource')||[]).forEach(function(r){
        if(/fonts\.gstatic\.com/.test(r.name))fetch(r.name,{mode:'cors'}).catch(function(){});
      });
      /* ask for every character the game uses, so each font slice is saved */
      var chars=Object.keys(W).map(function(k){return W[k][0];}).join('');
      if(document.fonts&&document.fonts.load){
        document.fonts.load('500 28px "Noto Sans SC"',chars).catch(function(){});
        document.fonts.load('700 28px "Noto Sans SC"',chars).catch(function(){});
      }
    }catch(e){}
  }
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(warm).catch(function(){});
  });
})();

render();
})();
</script>
</body>
</html>
